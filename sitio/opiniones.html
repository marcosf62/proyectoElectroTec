<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroTec - Dejanos tu Opinión</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

  <!-- barra de navegacion-->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-5">
      <a class="navbar-brand" href="index.html#inicio">
          <img src="img/logo.png" alt="ElectroTec Logo" width="40" height="40" class="me-2">
          <span style="color: orange;">Electro</span><span style="color: #007bff;">Tec</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#producto">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="eficiencia.html">Eficiencia Energética</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#nosotros">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>



    <!-- Sección principal -->
    <section class="py-5 text-center" 
            style="background: url('img/opiniones.jpeg') no-repeat center center fixed; 
                    background-size: cover;">
    <div style="background: rgba(0,0,0,0.45); padding: 50px 0;">
        <div class="container">
        <h2 class="mb-4" style="color: #ff7b00;">Dejanos tu Opinión</h2>
        <p class="lead mb-4" style="color: #ffffff;">Tu experiencia y comentarios nos ayudan a mejorar cada día.</p>

        <!-- Formulario Google -->
        <div class="d-flex justify-content-center">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSenULToZ5VJKHKGqrF7GpQg_ybyKasDaLEx4_OWgzIotxjtQg/viewform?embedded=true" 
            width="100%" height="900" frameborder="0" marginheight="0" marginwidth="0"
            style="max-width: 750px; border-radius: 10px; background: white;">
            Cargando…
            </iframe>
        </div>

        <!-- Botón para volver -->
        <a href="index.html#contacto" class="btn btn-electrotec mt-4">
            <i class="bi bi-arrow-left-circle"></i> Volver a la página principal
        </a>

        </div>
    </div>
    </section>



    <!-- Footer (igual que index.html) -->
    <footer class="bg-dark text-center py-3">
    <p class="mb-0" style="color: #cccccc;">&copy; 2025 ElectroTec - Todos los derechos reservados</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const navbar = document.querySelector('.navbar');

        window.addEventListener('scroll', () => {
        if (window.scrollY > 100) { // a partir de 100px de scroll
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
        });
    </script>
</body>
</html>
